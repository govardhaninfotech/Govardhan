<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Govardhan Institute - Loading Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOADING SCREEN
    ========================== -->

    <div id="loader">

        <div class="loader-content">

            <!-- Animated Ring -->
            <div class="logo-wrapper">

                <div class="loading-ring"></div>

                <img src="logo.png" alt="Govardhan Institute" class="loader-logo">

            </div>

            <!-- Loading Text -->
            <div class="loading-text">
                <span>Loading</span>
                <span class="dots"></span>
            </div>

        </div>

    </div>


    <!-- =========================
         WEBSITE CONTENT
    ========================== -->

    <main id="website">

        <h1>Welcome to Govardhan Institute</h1>

        <p>
            Your website content starts here.
        </p>

        <button>
            Explore Courses
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
